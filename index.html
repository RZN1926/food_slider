<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>КБЖУ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #111;
            --mute: #8a8a8a;
            --line: #e8e8e8
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #fff;
            color: var(--ink);
            font: 400 16px/1.4 Onest, system-ui, sans-serif
        }

        main {
            max-width: 520px;
            margin: 0 auto;
            padding: 28px 20px 80px
        }

        #totals {
            position: sticky;
            top: 0;
            background: #fff;
            padding: 12px 0 16px;
            border-bottom: 1px solid var(--line);
            z-index: 2
        }

        #kcal {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: -.02em
        }

        #kcal small {
            font-size: 15px;
            color: var(--mute);
            margin-left: 6px
        }

        .macros {
            display: flex;
            gap: 20px;
            color: var(--mute);
            font-size: 14px
        }

        .macros b {
            color: var(--ink);
            font-weight: 600
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0
        }

        li.item {
            padding: 18px 0;
            border-bottom: 1px solid var(--line)
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px
        }

        .name {
            font-weight: 600
        }

        .x {
            border: 0;
            background: none;
            color: var(--mute);
            font-size: 20px;
            cursor: pointer;
            padding: 0 4px
        }

        .sub {
            color: var(--mute);
            font-size: 13px;
            margin: 2px 0 8px
        }

        .g {
            font-variant-numeric: tabular-nums
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--ink);
            margin: 0
        }

        button.main {
            margin-top: 24px;
            width: 100%;
            padding: 14px;
            border: 1px solid var(--ink);
            background: var(--ink);
            color: #fff;
            border-radius: 10px;
            font: inherit;
            cursor: pointer
        }

        button.main:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 2px
        }

        #modal {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, .96);
            overflow: auto;
            z-index: 5
        }

        #modal[hidden] {
            display: none
        }

        .sheet {
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 20px
        }

        .bar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px
        }

        input[type=text],
        input[type=number] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font: inherit;
            background: #fff
        }

        .plus,
        .close {
            flex: none;
            width: 46px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 10px;
            font-size: 22px;
            cursor: pointer
        }

        .pick {
            display: block;
            width: 100%;
            text-align: left;
            padding: 14px 0;
            border: 0;
            border-bottom: 1px solid var(--line);
            background: none;
            font: inherit;
            cursor: pointer
        }

        .pick span {
            color: var(--mute);
            font-size: 13px;
            display: block
        }

        label {
            display: block;
            font-size: 13px;
            color: var(--mute);
            margin: 14px 0 4px
        }

        .chk {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 14px;
            font-size: 14px;
            color: var(--ink)
        }

        .gear {
            flex: none;
            width: 36px;
            height: 36px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 10px;
            cursor: pointer;
            display: grid;
            place-items: center
        }

        #settings {
            position: absolute;
            right: 0;
            top: 56px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            width: 210px;
            font-size: 13px;
            color: var(--mute)
        }

        #settings[hidden] {
            display: none
        }

        .seg {
            display: flex;
            gap: 6px;
            margin-top: 8px
        }

        .seg button {
            flex: 1;
            padding: 8px 0;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
            color: var(--ink);
            cursor: pointer
        }

        .seg button.on {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink)
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-top: 10px
        }

        .steps button {
            padding: 8px 0;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 8px;
            font: inherit;
            font-size: 13px;
            color: var(--ink);
            cursor: pointer;
            font-variant-numeric: tabular-nums
        }

        .steps button:active {
            background: var(--line)
        }

        .panel {
            max-height: 75vh;
            overflow: auto
        }

        #settings {
            width: 260px
        }

        #report {
            position: absolute;
            right: 0;
            top: 56px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px;
            width: 240px;
            font-size: 13px;
            color: var(--mute)
        }

        #report[hidden] {
            display: none
        }

        .lbl {
            margin-top: 14px
        }

        .srow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            color: var(--ink);
            font-size: 14px
        }

        .sw {
            appearance: none;
            -webkit-appearance: none;
            width: 38px;
            height: 22px;
            border-radius: 11px;
            background: #d4d4d4;
            position: relative;
            cursor: pointer;
            flex: none;
            margin: 0
        }

        .sw::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            transition: left .15s
        }

        .sw:checked {
            background: var(--ink)
        }

        .sw:checked::after {
            left: 18px
        }

        .plain {
            margin-top: 14px;
            width: 100%;
            padding: 10px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 10px;
            font: inherit;
            font-size: 14px;
            color: var(--ink);
            cursor: pointer
        }

        .pg {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 10px
        }

        .pg input {
            padding: 9px;
            font-size: 14px
        }

        .fmt {
            display: block;
            width: 100%;
            text-align: left;
            margin-top: 8px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            background: #fff;
            border-radius: 10px;
            font: inherit;
            font-size: 14px;
            color: var(--ink);
            cursor: pointer
        }

        .div {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 22px
        }

        .div::before,
        .div::after {
            content: '';
            flex: 1;
            border-top: 1px solid var(--line)
        }

        .pill {
            padding: 7px 14px;
            border: 1px dashed #bbb;
            background: #fff;
            border-radius: 10px;
            font: inherit;
            font-size: 13px;
            color: var(--mute);
            cursor: pointer
        }

        .mh {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .14em;
            text-transform: uppercase
        }

        .acts {
            display: flex;
            gap: 8px;
            margin-top: 10px
        }

        .steps {
            display: flex;
            gap: 3px;
            margin-top: 10px
        }

        .steps button {
            flex: 1;
            min-width: 0;
            padding: 8px 0;
            font-size: 12px
        }

        .steps button:nth-child(6) {
            margin-left: 14px
        }

        .ov {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .28);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 8;
            padding: 16px
        }

        .ov[hidden] {
            display: none
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            width: min(340px, 100%);
            box-shadow: 0 10px 40px rgba(0, 0, 0, .15);
            font-size: 15px
        }

        .prow {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--line)
        }

        .prow .pick {
            border: 0;
            flex: 1
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px
        }

        .icons {
            display: flex;
            gap: 8px
        }

        .dnav {
            display: flex;
            align-items: center;
            gap: 2px;
            position: relative
        }

        .ib {
            width: 32px;
            height: 36px;
            border: 0;
            background: none;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            color: var(--ink)
        }

        .dl {
            border: 0;
            background: none;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 8px;
            color: var(--ink)
        }

        #dpick {
            position: absolute;
            left: 0;
            top: 36px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none
        }

        #planbox,
        #actpill {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 10px 0 8px;
            padding: 8px 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #fafafa
        }

        #planbox[hidden],
        #actpill[hidden],
        #kcal[hidden],
        .macros[hidden] {
            display: none
        }

        #actpill {
            margin-top: 0
        }

        #settings,
        #report {
            z-index: 6
        }

        #pastbar {
            margin-top: 18px;
            padding-top: 0
        }

        .pc {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--mute)
        }

        .pc b {
            display: block;
            color: var(--ink);
            font-size: 14px;
            font-weight: 600;
            font-variant-numeric: tabular-nums
        }

        .bt {
            position: relative;
            width: 8px;
            height: 34px;
            border-radius: 4px;
            background: #ececec;
            flex: none;
            margin-top: 5px
        }

        .bt i {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 4px;
            transition: height .25s, background .25s
        }

        .bt u {
            position: absolute;
            left: 0;
            right: 0;
            top: -5px;
            height: 5px;
            border-radius: 4px 4px 0 0;
            display: none;
            text-decoration: none
        }

        #pastbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 12px 0 0;
            color: var(--mute);
            font-size: 13px
        }

        #pastbar[hidden] {
            display: none
        }

        .pb {
            display: flex;
            gap: 6px
        }

        .pill.ok {
            background: #111;
            color: #fff;
            border: 1px solid #111
        }

        .grp+.grp {
            border-top: 1px solid var(--line);
            margin-top: 14px;
            padding-top: 14px
        }

        .grp .srow,
        .grp .plain {
            margin-top: 0
        }

        .nm {
            border: 0;
            background: none;
            padding: 0;
            font: inherit;
            font-weight: 600;
            color: var(--ink);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-align: left
        }

        .nm::after {
            content: '';
            width: 6px;
            height: 6px;
            border-right: 1.5px solid var(--mute);
            border-bottom: 1.5px solid var(--mute);
            transform: rotate(45deg) translateY(-2px);
            transition: transform .15s
        }

        .nm[aria-expanded=true]::after {
            transform: rotate(-135deg) translateY(-1px)
        }

        .dd {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 10px 0 4px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fafafa;
            font-size: 12px;
            color: var(--mute)
        }

        .dd[hidden] {
            display: none
        }

        .ddt {
            grid-column: 1/-1
        }

        .dd b {
            display: block;
            color: var(--ink);
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums
        }

        /* масштаб интерфейса: на экранах от 600px — 140% (на телефонах без увеличения, чтобы ряд кнопок помещался) */
        @media (min-width:600px) {
            body {
                zoom: 1.4
            }
        }

        .msg {
            color: var(--mute);
            padding: 20px 0;
            font-size: 14px
        }

        #err {
            color: #b00020;
            font-size: 14px;
            padding-top: 12px
        }
    </style>
</head>

<body>
    <main>
        <div id="totals">
            <div class="top">
                <div class="dnav"><button class="ib" id="dprev" aria-label="Предыдущий день">‹</button><button
                        class="dl" id="dlabel"></button><button class="ib" id="dnext"
                        aria-label="Следующий день">›</button><input type="date" id="dpick" tabindex="-1"
                        aria-hidden="true"></div>
                <div class="icons">
                    <button class="gear" id="rbtn" aria-label="Скачать отчёт"><svg width="16" height="16"
                            viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M8 2v8M4.5 7 8 10.5 11.5 7M3 13.5h10" />
                        </svg></button>
                    <button class="gear" id="gear" aria-label="Настройки"><svg width="16" height="16"
                            viewBox="0 0 16 16" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round">
                            <path d="M2 4h12M2 8h12M2 12h12" />
                            <circle cx="10" cy="4" r="1.6" fill="#fff" />
                            <circle cx="5" cy="8" r="1.6" fill="#fff" />
                            <circle cx="11" cy="12" r="1.6" fill="#fff" />
                        </svg></button>
                </div>
            </div>
            <div id="settings" class="panel" hidden>
                <div class="grp">
                    <div>Шаг ползунка, г</div>
                    <div class="seg" id="seg"></div>
                </div>
                <div class="grp">
                    <div>Максимум ползунка, г</div>
                    <div class="seg" id="segMax"></div>
                </div>
                <div class="grp">
                    <div>Фактические данные</div>
                    <div class="seg" id="segAct"></div>
                </div>
                <div class="grp"><label class="srow"><span>Разделять по приёмам пищи</span><input type="checkbox"
                            class="sw" id="swMeals"></label></div>
                <div class="grp"><button class="plain" id="planBtn">Добавить свой план</button></div>
                <div class="grp">
                    <div>Аккаунт</div>
                    <div id="acc" style="color:var(--ink);font-size:14px;margin-top:6px"></div><button class="plain"
                        id="accBtn" style="margin-top:8px">Войти через Google</button>
                </div>
            </div>
            <div id="report" hidden>
                <div>Скачать отчёт за выбранный день</div>
                <div id="fmts"></div>
            </div>
            <div id="planbox" hidden></div>
            <div id="kcal"><span id="tk">0</span><small id="kp">ккал</small></div>
            <div class="macros" id="macros"><span>Б <b id="tp">0</b><span id="tpx"></span></span><span>Ж <b
                        id="tf">0</b><span id="tfx"></span></span><span>У <b id="tc">0</b><span id="tcx"></span></span>
            </div>
            <div id="actpill" hidden></div>
        </div>
        <div id="list"></div>
        <div id="err"></div>
        <button class="main" id="add">Добавить продукт</button>
        <div id="pastbar" hidden><span id="pastnote"></span><span class="pb"><button class="pill" id="editPast"
                    type="button">Изменить прошлое</button><button class="pill" id="cancelPast" type="button"
                    hidden>Отмена</button><button class="pill ok" id="okPast" type="button" hidden>Подтвердить
                    прошлое</button></span></div>
    </main>

    <div class="ov" id="pmodal" hidden>
        <div class="card">
            <strong>Свой план на день</strong>
            <div class="pg"><input type="number" id="inK" placeholder="Ккал" min="0"><input type="number" id="inP"
                    placeholder="Белки, г" min="0"><input type="number" id="inF" placeholder="Жиры, г" min="0"><input
                    type="number" id="inC" placeholder="Углеводы, г" min="0"></div>
            <div class="pg"><button class="plain" id="planSave"
                    style="margin:0;background:#111;color:#fff">Сохранить</button><button class="plain" id="planCancel"
                    style="margin:0">Отмена</button></div>
            <button class="plain" id="planClear" style="color:#b00020">Убрать</button>
        </div>
    </div>
    <div class="ov" id="cmodal" style="z-index:9" hidden>
        <div class="card">
            <div id="ctext"></div>
            <div class="pg"><button class="plain" id="cno" style="margin:0">Отмена</button><button class="plain"
                    id="cyes" style="margin:0;background:#b00020;color:#fff;border-color:#b00020">Убрать</button></div>
        </div>
    </div>

    <div id="modal" hidden>
        <div class="sheet" id="sheet"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script>
        // Конфиг лежит в отдельном файле config.js (рядом с index.html)
        if (typeof firebaseConfig === 'undefined') { document.body.textContent = 'Не найден config.js с настройками Firebase'; throw new Error('config.js missing'); }
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), fs = firebase.firestore();
        fs.enablePersistence({ synchronizeTabs: true }).catch(() => { });
        let uid = null;
        const meta = () => fs.collection('users').doc(uid);
        const col = n => meta().collection(n);
        const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
        let curDay = today, editPast = false, orig = null, actPill = false;
        let products = [], entries = [], step = 5, limit = 500, mealsOn = false, meals = ['Завтрак', 'Обед', 'Ужин'], plan = null, curMeal = null;
        const $ = id => document.getElementById(id);
        const r1 = n => Math.round(n * 10) / 10;
        const showErr = e => { $('err').textContent = e ? 'Ошибка: ' + (e.message || e) : ''; };

        function el(tag, props = {}, ...kids) {
            const n = Object.assign(document.createElement(tag), props);
            kids.forEach(k => n.append(k));
            return n;
        }
        const prod = id => products.find(p => p.id === id);

        // ---------- данные ----------
        async function init() {
            dayUi();
            try {
                let user = await new Promise(r => { const un = auth.onAuthStateChanged(x => { un(); r(x); }); });
                if (!user) user = (await auth.signInAnonymously()).user;
                uid = user.uid; renderAcc();
                const load = o => Promise.all([meta().get(o), col('products').get(o), col('entries').where('day', '==', curDay).get(o)]);
                const apply = ([m, a, b]) => {
                    const md = m.data() || {};
                    meals = ['Завтрак', 'Обед', 'Ужин'];
                    step = [1, 5, 10].includes(md.step) ? md.step : 5;
                    limit = [500, 1000, 1500, 2000].includes(md.max) ? md.max : 500;
                    mealsOn = !!md.meals_on; if (Array.isArray(md.meals) && md.meals.length) meals = md.meals; plan = md.plan || null; actPill = !!md.act_pill;
                    $('swMeals').checked = mealsOn; fillPlan(); renderSeg();
                    products = a.docs.map(d => ({ id: d.id, ...d.data() })).sort((x, y) => x.name.localeCompare(y.name, 'ru'));
                    entries = b.docs.map(d => ({ id: d.id, ...d.data() })).sort((x, y) => (x.created || 0) - (y.created || 0));
                    render();
                };
                try { apply(await load({ source: 'cache' })); } catch (e) { }   // мгновенно из локального кэша
                apply(await load());                                      // затем свежие данные с сервера
            } catch (e) { showErr(e); }
        }

        function addEntry(p) {
            if (locked()) return;
            const data = { product_id: p.id, day: curDay, grams: 100, created: Date.now(), ...(mealsOn ? { meal: curMeal || meals[0] } : {}) };
            const ref = col('entries').doc();
            entries.push({ id: ref.id, ...data }); render(); closeModal();
            if (!staged()) ref.set(data).catch(showErr);
        }
        const timers = {};
        function saveGrams(e) {
            if (staged()) return;
            clearTimeout(timers[e.id]);
            timers[e.id] = setTimeout(() => col('entries').doc(e.id).update({ grams: e.grams }).catch(showErr), 400);
        }

            const auto = el('input', { type: 'checkbox', checked: true });
            sheet.append(el('label', { className: 'chk' }, auto, 'Считать калории автоматически (4·Б + 9·Ж + 4·У)'));
            const calc = () => { f.kcal.value = r1(4 * (+f.p.value || 0) + 9 * (+f.f.value || 0) + 4 * (+f.c.value || 0)) || ''; };
            [f.p, f.f, f.c].forEach(i => i.oninput = () => { if (auto.checked) calc(); });
            auto.onchange = () => {
                f.kcal.readOnly = auto.checked;
                if (auto.checked) calc(); else { f.kcal.value = ''; f.kcal.focus(); }
            };
            f.kcal.readOnly = true; calc();
            const save = el('button', { className: 'main', textContent: 'Сохранить' });
            const msg = el('div', { id: 'err' });
            save.onclick = async () => {
                const name = f.name.value.trim();
                if (!name) { msg.textContent = 'Введите название'; return; }
                const row = { name, p: +f.p.value || 0, f: +f.f.value || 0, c: +f.c.value || 0, kcal: +f.kcal.value || 0 };
                const ref = col('products').doc(); const data = { id: ref.id, ...row };
                ref.set(row).catch(showErr);
                products.push(data); products.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
                if (mealsOn) addEntry(data); else viewSearch();
            };
            sheet.append(msg, save); f.name.focus();
        }

        $('add').onclick = () => openModal();
        document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); toggle(null); $('pmodal').hidden = true; $('cmodal').hidden = true; } });
        init();
    </script>
</body>

</html>
